<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ಪ್ರತಿಭಾನ್ವೇಷಣೆ ಪರೀಕ್ಷೆ</title>
<meta name="description" content="7 ಮತ್ತು 8ನೇ ತರಗತಿ ವಿದ್ಯಾರ್ಥಿಗಳಿಗಾಗಿ ಪ್ರತಿಭಾನ್ವೇಷಣೆ ಪರೀಕ್ಷೆ – ಪಠ್ಯಕ್ರಮ, ವೇಳಾಪಟ್ಟಿ, ಮಾದರಿ ಪ್ರಶ್ನೆಪತ್ರಿಕೆ, ಫಲಿತಾಂಶ">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--mut:#64748b;--p:#4f46e5;--p2:#7c3aed;--gold:#f59e0b;--bg:#f8fafc;--card:#fff;--bd:#e2e8f0}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Noto Sans Kannada','Tunga','Nirmala UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
a{color:var(--p)}
.ann{background:#fef3c7;color:#78350f;text-align:center;padding:8px 12px;font-weight:600;font-size:14px}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.nav .in{max-width:1100px;margin:auto;display:flex;align-items:center;gap:6px;padding:8px 14px;overflow-x:auto;white-space:nowrap}
.nav b{margin-right:auto;color:var(--p);font-size:16px}
.nav a{text-decoration:none;color:var(--ink);font-size:14px;padding:6px 10px;border-radius:20px}.nav a:hover{background:#eef2ff}
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(1200px 500px at 10% -10%,#a78bfa 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#f472b6 0,transparent 55%),linear-gradient(135deg,#312e81,#4f46e5 45%,#7c3aed)}
.hero .in{max-width:1100px;margin:auto;padding:54px 18px 64px;text-align:center;position:relative;z-index:1}
.hero .sch{display:inline-block;background:rgba(255,255,255,.16);padding:4px 14px;border-radius:20px;font-size:14px;margin-bottom:12px}
.hero h1{font-size:clamp(30px,6vw,52px);margin:6px 0;font-weight:800;letter-spacing:.3px;text-shadow:0 4px 24px rgba(0,0,0,.25)}
.hero .yr{font-size:clamp(18px,3vw,24px);opacity:.95}
.hero p.tag{font-size:clamp(15px,2.5vw,19px);opacity:.92;margin:8px auto 22px;max-width:720px}
.prizes{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px}
.prize{background:linear-gradient(160deg,#fde68a,#f59e0b);color:#451a03;border-radius:20px;padding:16px 26px;min-width:200px;box-shadow:0 14px 40px rgba(0,0,0,.25);transform:rotate(-1deg)}
.prize:nth-child(2){transform:rotate(1deg)}
.prize .c{font-weight:700;font-size:15px}.prize .a{font-size:40px;font-weight:800;line-height:1.1}.prize .t{font-size:14px}
.pnote{font-size:15px;margin-top:10px;opacity:.95}
.cd{display:flex;gap:10px;justify-content:center;margin:22px 0 6px;flex-wrap:wrap}
.cd div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 14px;min-width:78px}
.cd b{display:block;font-size:28px;line-height:1.1}.cd span{font-size:12px;opacity:.9}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--p);padding:11px 20px;border-radius:30px;font-weight:700;text-decoration:none;border:0;font:inherit;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.btn.o{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7);box-shadow:none}
.btn.p{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.btn.s{background:#eef2ff;color:var(--p);box-shadow:none}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.25;background:#fff}
section.sec{max-width:1100px;margin:auto;padding:44px 16px 10px}
section.sec h2{font-size:clamp(22px,4vw,30px);margin:0 0 6px;font-weight:800}
section.sec h2 span{background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(15,23,42,.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.facts .card{text-align:center}.facts b{display:block;font-size:30px;color:var(--p)}
.tl{position:relative;margin-left:10px;border-left:3px solid #c7d2fe;padding-left:20px}
.tl .it{position:relative;margin:0 0 18px}
.tl .it:before{content:'';position:absolute;left:-29px;top:5px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--p)}
.tl .it.done:before{background:var(--p)}.tl .it.next:before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 6px #fde68a}
.tl .d{font-weight:700;color:var(--p)}.tl .it.done{opacity:.6}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:#eef2ff;color:var(--p);padding:9px 18px;border-radius:24px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
table.pt{width:100%;border-collapse:collapse}table.pt td,table.pt th{padding:9px;border-bottom:1px solid var(--bd);text-align:left}table.pt th{color:var(--mut);font-weight:600}
.subj h3{margin:14px 0 6px;font-size:17px}.subj ul{margin:0;padding-left:20px}.subj li{margin:3px 0}
.chip{display:inline-block;background:#eef2ff;color:var(--p);border-radius:20px;padding:2px 10px;font-size:13px;font-weight:600}
.rules li{margin:6px 0}
.omr-demo{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #111;vertical-align:middle;margin:0 2px;position:relative;font-size:13px;text-align:center;line-height:18px}
.dot.f{background:#111}
.res table{width:100%;border-collapse:collapse}.res td,.res th{padding:9px;border-bottom:1px solid var(--bd);text-align:left}
.medal{font-size:22px}
.sp{display:flex;gap:12px;flex-wrap:wrap}.sp .card{flex:1 1 220px;text-align:center}.sp b{font-size:18px}
footer{background:#0f172a;color:#cbd5e1;margin-top:50px;padding:30px 16px;text-align:center;font-size:14px}footer b{color:#fff}
.empty{color:var(--mut);font-style:italic}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:50;overflow:auto;padding:12px;display:none}
.mbox{background:#fff;max-width:900px;margin:0 auto;border-radius:18px;padding:16px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-12px;background:#fff;padding:6px 0;z-index:2;border-bottom:1px solid var(--bd)}
.mq{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.mq .q{font-weight:600}.mq .en{color:var(--mut);font-size:14px;margin-top:2px}
.mq label{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:10px;cursor:pointer;margin:3px 0;border:1px solid transparent}
.mq label:hover{background:#f1f5f9}.mq input{margin-top:5px}
.mq label.ok{background:#dcfce7;border-color:#86efac}.mq label.no{background:#fee2e2;border-color:#fca5a5}
.mq .ex{font-size:13px;background:#fefce8;border-radius:8px;padding:6px 9px;margin-top:6px;display:none}
.mq img{max-width:100%;max-height:220px;display:block;margin:8px 0;border-radius:8px}
.mq .sh{font-size:12px;color:var(--p);font-weight:700}
.score{font-size:26px;font-weight:800;text-align:center;padding:12px;border-radius:14px;background:linear-gradient(135deg,#eef2ff,#fdf4ff);margin:10px 0}
.reveal{opacity:0;transform:translateY(16px);transition:.6s}.reveal.vis{opacity:1;transform:none}
.loadbox{text-align:center;padding:60px 10px;color:var(--mut)}
@media(max-width:600px){.prize{min-width:150px;padding:12px 18px}.prize .a{font-size:32px}}
</style>
<script src="common.js"></script>
<script>document.write('<style>'+PRINT_CSS+'</style>')</script>
</head>
<body>
<div id="ann" class="ann" style="display:none"></div>
<div class="nav"><div class="in"><b id="navT">ಪ್ರತಿಭಾನ್ವೇಷಣೆ</b>
 <a href="#dates">ದಿನಾಂಕಗಳು</a><a href="#syllabus">ಪಠ್ಯಕ್ರಮ</a><a href="#mock">ಮಾದರಿ ಪತ್ರಿಕೆ</a><a href="#omr">OMR</a><a href="#rules">ನಿಯಮಗಳು</a><a href="#results" id="navRes" style="display:none">ಫಲಿತಾಂಶ</a><a href="#contact">ಸಂಪರ್ಕ</a></div></div>
<div id="root"><div class="loadbox">ಲೋಡ್ ಆಗುತ್ತಿದೆ…</div></div>

<div id="mockModal" class="modal"><div class="mbox">
 <div class="mhead"><b id="mkTitle">ಮಾದರಿ ಪ್ರಶ್ನೆಪತ್ರಿಕೆ</b><div><button class="btn s" id="mkPrint">🖨 ಮುದ್ರಿಸು</button> <button class="btn s" id="mkClose">✕</button></div></div>
 <div id="mkBody"></div>
</div></div>
<div id="printArea"></div>

<script>
'use strict';
let C=null;
const root=$('#root');
function D(d){if(!d)return null;const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd)}
async function boot(){
 try{C=await PUB.get('pratibha_public/site')}catch(e){root.innerHTML=`<div class="loadbox">ಮಾಹಿತಿ ಲೋಡ್ ಆಗಲಿಲ್ಲ. ಇಂಟರ್ನೆಟ್ ಪರಿಶೀಲಿಸಿ ಪುಟವನ್ನು ಮತ್ತೆ ತೆರೆಯಿರಿ.<br><small>${esc(e.message)}</small></div>`;return}
 if(!C){root.innerHTML='<div class="loadbox">ಪರೀಕ್ಷೆಯ ಮಾಹಿತಿ ಶೀಘ್ರದಲ್ಲೇ ಪ್ರಕಟವಾಗಲಿದೆ.</div>';return}
 render()}
function render(){const cls=(C.classes||[]).map(Number);document.title=`${C.examName} ${C.activeYear}`;$('#navT').textContent=C.examName;
 if(C.announcement){$('#ann').style.display='block';$('#ann').textContent='📢 '+C.announcement}
 const prizes=(C.prizes||[]).map(p=>`<div class="prize"><div class="c">${esc(p.cls)}ನೇ ತರಗತಿ • ${esc(p.title)}</div><div class="a">₹${Number(p.amount||0).toLocaleString('en-IN')}</div><div class="t">ನಗದು ಬಹುಮಾನ</div></div>`).join('');
 const sv=C.syllabusView||{};const res=C.results||{};const today=new Date();today.setHours(0,0,0,0);
 const tl=(C.timeline||[]).filter(t=>t.date);let nextI=tl.findIndex(t=>D(t.date)>=today);
 let h=`<header class="hero"><div class="blob" style="width:300px;height:300px;left:-80px;top:120px"></div><div class="blob" style="width:200px;height:200px;right:-50px;top:-40px"></div>
 <div class="in">${C.school?`<div class="sch">🏫 ${esc(C.school)}</div>`:''}<h1>${esc(C.examName)}</h1><div class="yr">${esc(C.activeYear)}</div>
 <p class="tag">${esc(C.tagline||'')}</p><div class="prizes">${prizes}</div><div class="pnote">🏆 ${esc(C.prizeNote||'')}</div>
 <div class="cd" id="cd"></div><div class="cta"><a class="btn" href="#syllabus">📚 ಪಠ್ಯಕ್ರಮ</a><a class="btn o" href="#mock">📝 ಮಾದರಿ ಪತ್ರಿಕೆ</a>${res.published?'<a class="btn o" href="#results">🏅 ಫಲಿತಾಂಶ</a>':''}</div></div></header>
 <section class="sec facts reveal"><div class="grid">
  <div class="card"><b>📅</b>ಪರೀಕ್ಷಾ ದಿನಾಂಕ<br><strong>${esc(fmtDate(C.examDate))}</strong></div>
  <div class="card"><b>⏰</b>ಸಮಯ<br><strong>${esc(C.examTime||'')}</strong></div>
  <div class="card"><b>${cls.map(c=>(sv[c]||{}).total||'').filter(Boolean)[0]||100}</b>ಬಹು ಆಯ್ಕೆ ಪ್ರಶ್ನೆಗಳು • ${esc(C.durationMin)} ನಿಮಿಷ</div>
  <div class="card"><b>0</b>ಋಣಾತ್ಮಕ ಅಂಕ ಇಲ್ಲ • ಕನ್ನಡ + English ಪ್ರಶ್ನೆಗಳು</div></div></section>
 <section class="sec reveal" id="dates"><h2><span>ಪ್ರಮುಖ ದಿನಾಂಕಗಳು</span></h2><p class="lead">ಪರೀಕ್ಷೆಯ ಪ್ರತಿ ಹಂತದ ವೇಳಾಪಟ್ಟಿ</p>
  <div class="card"><div class="tl">${tl.length?tl.map((t,i)=>`<div class="it ${D(t.date)<today?'done':''} ${i===nextI?'next':''}"><div class="d">${esc(fmtDate(t.date))}${i===nextI?' <span class="chip">ಮುಂದಿನದು</span>':''}</div><div>${esc(t.label)}</div></div>`).join(''):'<p class="empty">ಶೀಘ್ರದಲ್ಲೇ</p>'}</div></div></section>
 <section class="sec reveal" id="syllabus"><h2><span>ಪಠ್ಯಕ್ರಮ ಮತ್ತು ಪರೀಕ್ಷೆಯ ಸ್ವರೂಪ</span></h2><p class="lead">ಪ್ರತಿ ತರಗತಿಗೆ ಪ್ರತ್ಯೇಕ ಪ್ರಶ್ನೆಪತ್ರಿಕೆ. ಪ್ರಶ್ನೆಗಳು ಸ್ಪರ್ಧಾತ್ಮಕ ಪರೀಕ್ಷೆಗಳ ಮಾದರಿಯಲ್ಲಿರುತ್ತವೆ – ಪರಿಕಲ್ಪನೆ, ಅನ್ವಯ ಮತ್ತು ತಾರ್ಕಿಕ ಚಿಂತನೆ ಆಧಾರಿತ.</p>
  <div class="tabs" id="sylTabs">${cls.map((c,i)=>`<button data-c="${c}" class="${i?'':'on'}">${c}ನೇ ತರಗತಿ</button>`).join('')}</div><div class="card" id="sylBox"></div></section>
 <section class="sec reveal" id="mock"><h2><span>ಮಾದರಿ ಪ್ರಶ್ನೆಪತ್ರಿಕೆ</span></h2><p class="lead">ಆನ್‌ಲೈನ್‌ನಲ್ಲೇ ಅಭ್ಯಾಸ ಮಾಡಿ – ಉತ್ತರ ಆಯ್ಕೆ ಮಾಡಿ, ಕೊನೆಯಲ್ಲಿ ನಿಮ್ಮ ಅಂಕ ಮತ್ತು ಸರಿಯುತ್ತರಗಳನ್ನು ನೋಡಿ. ಮುದ್ರಿಸಿ ತರಗತಿಯಲ್ಲೂ ಬಳಸಬಹುದು.</p>
  <div class="grid">${cls.map(c=>`<div class="card"><h3 style="margin:0 0 6px">${c}ನೇ ತರಗತಿ</h3>${(C.mockPublished||{})[c]?`<button class="btn p" data-mock="${c}">📝 ಅಭ್ಯಾಸ ಆರಂಭಿಸಿ</button>`:'<p class="empty">ಮಾದರಿ ಪತ್ರಿಕೆ ಶೀಘ್ರದಲ್ಲೇ ಪ್ರಕಟವಾಗಲಿದೆ</p>'}</div>`).join('')}</div></section>
 <section class="sec reveal" id="omr"><h2><span>OMR ಹಾಳೆ ತುಂಬುವ ವಿಧಾನ</span></h2><p class="lead">ಉತ್ತರಗಳನ್ನು OMR ಹಾಳೆಯಲ್ಲಿ ಗುರುತಿಸಬೇಕು. ಮನೆಯಲ್ಲೇ ಅಭ್ಯಾಸ ಮಾಡಲು ಖಾಲಿ OMR ಮುದ್ರಿಸಿಕೊಳ್ಳಿ.</p>
  <div class="card"><div class="omr-demo"><div>✅ <b>ಸರಿಯಾದ ವಿಧಾನ:</b> <span class="dot">A</span><span class="dot">B</span><span class="dot f"></span><span class="dot">D</span></div>
   <div>❌ <b>ತಪ್ಪು ವಿಧಾನಗಳು:</b> <span class="dot">✓</span><span class="dot">✗</span><span class="dot">•</span><span class="dot" style="background:linear-gradient(#fff 50%,#111 50%)"></span></div></div>
   <ul><li>ನೀಲಿ ಅಥವಾ ಕಪ್ಪು ಬಾಲ್‌ಪೆನ್‌ನಿಂದ ವೃತ್ತವನ್ನು ಪೂರ್ತಿಯಾಗಿ ತುಂಬಿ.</li><li>ಒಂದು ಪ್ರಶ್ನೆಗೆ ಒಂದೇ ವೃತ್ತ. ಒಮ್ಮೆ ತುಂಬಿದ ಉತ್ತರ ಬದಲಿಸುವಂತಿಲ್ಲ.</li><li>ನೋಂದಣಿ ಸಂಖ್ಯೆ ಮತ್ತು ಪ್ರಶ್ನೆಪತ್ರಿಕೆಯ ಸೆಟ್ (A/B/C/D) ವೃತ್ತಗಳನ್ನು ತಪ್ಪದೆ ತುಂಬಿ.</li><li>ಹಾಳೆಯನ್ನು ಮಡಚಬೇಡಿ, ಮೂಲೆಯ ಕಪ್ಪು ಚೌಕಗಳ ಮೇಲೆ ಬರೆಯಬೇಡಿ.</li></ul>
   <button class="btn p" id="omrDl">🖨 ಅಭ್ಯಾಸಕ್ಕಾಗಿ ಖಾಲಿ OMR ಮುದ್ರಿಸಿ</button></div></section>
 <section class="sec reveal" id="rules"><h2><span>ನಿಯಮಗಳು</span></h2><div class="card"><ol class="rules">${(C.rules||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ol></div></section>`;
 if(res.published){h+=`<section class="sec reveal" id="results"><h2><span>🏅 ಫಲಿತಾಂಶ – ವಿಜೇತರು</span></h2><p class="lead">ಎಲ್ಲಾ ವಿಜೇತರಿಗೆ ಹೃತ್ಪೂರ್ವಕ ಅಭಿನಂದನೆಗಳು!</p><div class="grid res">`+
  cls.map(c=>{const l=(res.lists||{})[c]||[];return `<div class="card"><h3 style="margin:0 0 8px">${c}ನೇ ತರಗತಿ</h3>${l.length?`<table><tr><th>ಸ್ಥಾನ</th><th>ಹೆಸರು</th><th>ಅಂಕ</th></tr>${l.map(x=>`<tr><td>${x.rank<=3?`<span class="medal">${['🥇','🥈','🥉'][x.rank-1]}</span>`:x.rank}</td><td><b>${esc(x.name)}</b><br><small>${esc(x.school||'')}</small></td><td>${x.score}/${x.of}</td></tr>`).join('')}</table>`:'<p class="empty">—</p>'}</div>`}).join('')+'</div></section>';$('#navRes').style.display=''}
 if((C.sponsors||[]).length)h+=`<section class="sec reveal" id="sponsors"><h2><span>ಪ್ರಾಯೋಜಕರು</span></h2><p class="lead">ಮಕ್ಕಳ ಪ್ರತಿಭೆಗೆ ಪ್ರೋತ್ಸಾಹ ನೀಡುತ್ತಿರುವ ಸಹೃದಯರಿಗೆ ಧನ್ಯವಾದಗಳು 🙏</p><div class="sp">${C.sponsors.map(s=>`<div class="card"><b>${esc(s.name)}</b><br><span style="color:var(--mut)">${esc(s.note||'')}</span></div>`).join('')}</div></section>`;
 h+=`<footer id="contact"><b>${esc(C.examName)} ${esc(C.activeYear)}</b><br>${esc(C.school||'')}${C.address?'<br>'+esc(C.address):''}${C.contact?`<br>📞 <a style="color:#fff" href="tel:${esc(C.contact)}">${esc(C.contact)}</a>`:''}${C.hm?'<br>ಮುಖ್ಯ ಶಿಕ್ಷಕರು: '+esc(C.hm):''}</footer>`;
 root.innerHTML=h;
 document.querySelectorAll('#sylTabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#sylTabs button').forEach(x=>x.classList.toggle('on',x===b));showSyl(+b.dataset.c)});if(cls.length)showSyl(cls[0]);
 document.querySelectorAll('[data-mock]').forEach(b=>b.onclick=()=>openMock(+b.dataset.mock));
 $('#omrDl').onclick=()=>doPrint(`<div class="page">${omrSVG(C,null,Math.max(...cls.map(c=>(sv[c]||{}).total||100)))}</div>`);
 tick();setInterval(tick,30000);
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(x=>io.observe(x))}
function tick(){const el=$('#cd');if(!el)return;const d=D(C.examDate);if(!d){el.innerHTML='';return}const m=(C.examTime||'').match(/(\d{1,2})[:.](\d{2})/);d.setHours(m?+m[1]:10,m?+m[2]:0);
 const ms=d-new Date();if(ms<=0){el.innerHTML=ms>-86400000?'<div><b>ಇಂದು</b><span>ಪರೀಕ್ಷೆ</span></div>':'';return}
 const dd=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5),mm=Math.floor(ms%36e5/6e4);el.innerHTML=`<div><b>${dd}</b><span>ದಿನಗಳು</span></div><div><b>${hh}</b><span>ಗಂಟೆ</span></div><div><b>${mm}</b><span>ನಿಮಿಷ</span></div>`}
function showSyl(c){const v=(C.syllabusView||{})[c];const box=$('#sylBox');if(!v){box.innerHTML='<p class="empty">ಪಠ್ಯಕ್ರಮ ಶೀಘ್ರದಲ್ಲೇ ಪ್ರಕಟವಾಗಲಿದೆ</p>';return}
 const notes=v.notes||{};
 box.innerHTML=`<h3 style="margin-top:0">${c}ನೇ ತರಗತಿ – ಪ್ರಶ್ನೆಗಳ ಹಂಚಿಕೆ</h3><table class="pt"><tr><th>ವಿಭಾಗ</th><th>ಪ್ರಶ್ನೆಗಳು</th></tr>${v.pattern.map(p=>`<tr><td>${esc(p.name)}</td><td><b>${p.n}</b></td></tr>`).join('')}<tr><td><b>ಒಟ್ಟು</b></td><td><b>${v.total}</b></td></tr></table>
 <div class="subj">${v.subjects.map(s=>`<h3>📘 ${esc(s.name)}</h3><ul>${s.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`).join('')}
 ${['gk','mat','ca','lang'].filter(k=>v.pattern.some(p=>p.sec===k)&&notes[k]).map(k=>`<h3>✨ ${esc(SECS[k].kn)}</h3><p style="margin:0">${esc(notes[k])}</p>`).join('')}</div>`}
let MK=null;
async function openMock(c){$('#mockModal').style.display='block';document.body.style.overflow='hidden';$('#mkBody').innerHTML='<div class="loadbox">ಲೋಡ್ ಆಗುತ್ತಿದೆ…</div>';
 try{MK=await PUB.get('pratibha_public/mock_'+c)}catch(e){MK=null}
 if(!MK){$('#mkBody').innerHTML='<div class="loadbox">ಮಾದರಿ ಪತ್ರಿಕೆ ಲಭ್ಯವಿಲ್ಲ</div>';return}
 for(const q of MK.qs){if(q.img&&q.img.startsWith('PUB:')){try{const d=await PUB.get('pratibha_public/'+q.img.slice(4));q.img=d?d.data:''}catch(e){q.img=''}}}
 $('#mkTitle').textContent=MK.title;
 $('#mkBody').innerHTML=`<p style="color:var(--mut)">ಒಟ್ಟು ${MK.qs.length} ಪ್ರಶ್ನೆಗಳು. ಉತ್ತರಗಳನ್ನು ಆಯ್ಕೆ ಮಾಡಿ ಕೊನೆಯಲ್ಲಿ "ಮುಗಿಸಿ" ಒತ್ತಿ.</p>`+MK.qs.map((q,i)=>{const s=MK.sections.find(s=>s.from===i);
  return (s?`<h3 style="margin:18px 0 0;color:var(--p)">${esc(s.name)}</h3>`:'')+`<div class="mq" id="mq${i}"><div class="q">${i+1}. ${esc(q.q_kn)}</div>${q.q_en?`<div class="en">${esc(q.q_en)}</div>`:''}${q.img?`<img src="${q.img}" alt="">`:''}
  ${q.opt_kn.map((o,k)=>`<label data-k="${LET[k]}"><input type="radio" name="m${i}" value="${LET[k]}"><span><b>${LET[k]})</b> ${esc(o)}${q.opt_en&&q.opt_en[k]?` <span style="color:var(--mut)">/ ${esc(q.opt_en[k])}</span>`:''}</span></label>`).join('')}
  <div class="ex">✔ ಸರಿಯುತ್ತರ: <b>${q.ans}</b>${q.exp_kn?' – '+esc(q.exp_kn):''}</div></div>`}).join('')+`<div id="mkScore"></div><div style="text-align:center;margin:14px 0"><button class="btn p" id="mkDone">✔ ಮುಗಿಸಿ – ಅಂಕ ನೋಡಿ</button></div>`;
 $('#mkDone').onclick=()=>{let sc=0,att=0;MK.qs.forEach((q,i)=>{const sel=document.querySelector(`input[name=m${i}]:checked`);const box=$('#mq'+i);if(sel)att++;
  box.querySelectorAll('label').forEach(l=>{l.classList.remove('ok','no');if(l.dataset.k===q.ans)l.classList.add('ok');else if(sel&&sel.value===l.dataset.k)l.classList.add('no')});
  box.querySelector('.ex').style.display='block';if(sel&&sel.value===q.ans)sc++});
  const pct=Math.round(sc/MK.qs.length*100);$('#mkScore').innerHTML=`<div class="score">ನಿಮ್ಮ ಅಂಕ: ${sc} / ${MK.qs.length} (${pct}%)<br><small style="font-size:15px;font-weight:600">ಉತ್ತರಿಸಿದ್ದು ${att} • ${pct>=80?'ಅದ್ಭುತ! 🌟':pct>=60?'ಉತ್ತಮ! ಇನ್ನಷ್ಟು ಅಭ್ಯಾಸ ಮಾಡಿ 👍':'ಚಿಂತೆ ಬೇಡ – ಸರಿಯುತ್ತರಗಳನ್ನು ಓದಿ, ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ 💪'}</small></div>`;
  $('#mkScore').scrollIntoView({behavior:'smooth'})}}
$('#mkClose').onclick=()=>{$('#mockModal').style.display='none';document.body.style.overflow=''};
$('#mkPrint').onclick=()=>{if(!MK)return;const op=a=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:1mm 4mm">${a.map((o,k)=>`<div>${LET[k]}) ${esc(o)}</div>`).join('')}</div>`;
 let h=`<div class="flow" style="font-size:3.3mm;color:#000"><h2 style="text-align:center;margin:0 0 3mm">${esc(MK.title)}</h2><table style="width:100%;border-collapse:collapse">`;
 MK.qs.forEach((q,i)=>{const s=MK.sections.find(s=>s.from===i);if(s)h+=`<tr><td colspan="2" style="border:.25mm solid #000;background:#eee;font-weight:700;text-align:center;padding:1.5mm">${esc(s.name)}</td></tr>`;
  h+=`<tr><td style="border:.25mm solid #000;padding:1.5mm;width:50%;vertical-align:top"><b>${i+1}.</b> ${esc(q.q_kn)}${op(q.opt_kn)}</td><td style="border:.25mm solid #000;padding:1.5mm;vertical-align:top">${q.q_en?`<b>${i+1}.</b> ${esc(q.q_en)}${op(q.opt_en)}`:''}</td></tr>`;
  if(q.img)h+=`<tr><td colspan="2" style="border:.25mm solid #000;text-align:center"><img src="${q.img}" style="max-height:50mm;max-width:120mm"></td></tr>`});
 h+=`</table><h3 style="margin-top:6mm">ಉತ್ತರ ಕೀ</h3><p>${MK.qs.map((q,i)=>`${i+1}-${q.ans}`).join(', ')}</p></div>`;doPrint(h)};
document.write('<style>@media print{@page flow{size:A4;margin:11mm 10mm}.flow{page:flow}.flow tr{break-inside:avoid}}</style>');
boot();
</script>
</body>
</html>
